<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects map — Hubtown</title>
<meta name="description" content="Hubtown developments across Mumbai MMR — residential and commercial projects, completed, under construction and upcoming.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/projects.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head>
<body class="map-body">

<div class="map" id="map">
  <!-- shown only if WebGL is unavailable -->
  <img class="map__fallback" src="uploads/images/map-mumbai-4k.jpeg" alt="" aria-hidden="true">
  <canvas class="map__gl" id="gl" aria-label="Interactive 3D map of Hubtown projects in Mumbai"></canvas>
  <div class="map__vignette" aria-hidden="true"></div>

  <!-- HTML labels projected from the 3D scene each frame -->
  <div class="labels" id="labels"></div>

  <div class="frame" aria-hidden="true"></div>

  <div class="cursor" id="cursor" aria-hidden="true">
    <span class="cursor__ring" id="cursorRing"></span>
    <span class="cursor__dot"></span>
  </div>

  <header class="map-head">
    <div class="map-head__left">
      <a href="index.html" class="map-head__back">← Back</a>
      <a href="index.html" class="wordmark wordmark--sm">HUB<b>TOWN</b></a>
    </div>
    <p class="eyebrow map-head__label">Projects map · Mumbai MMR</p>
  </header>

  <nav class="regions" id="regions" aria-label="Areas"></nav>

  <div class="hud hud--left">
    <canvas class="minimap" id="minimap" width="240" height="180" aria-label="Minimap — click to jump"></canvas>
    <div class="hud__row">Zoom <span class="hud__val" id="zoomText">1.00×</span>
      <span class="hud__scale"><span class="hud__val" id="scaleText">2 km</span><span class="hud__scalebar" id="scaleBar"></span></span>
    </div>
    <div class="hud__row"><span class="hud__val" id="visCount">05</span> / <span id="totalCount">05</span> projects</div>
  </div>

  <div class="compass" aria-hidden="true">
    <div class="compass__dial">
      <span class="compass__n">N</span><span class="compass__s">S</span>
      <span class="compass__w">W</span><span class="compass__e">E</span>
      <span class="compass__needle"></span>
    </div>
    <span class="compass__deg">000°</span>
  </div>

  <div class="bar">
    <button class="bar__btn" id="listBtn" type="button" aria-expanded="false" aria-controls="plist"><span aria-hidden="true">≔</span> Open project list</button>
    <button class="bar__btn bar__btn--right" id="filterBtn" type="button" aria-expanded="false" aria-controls="chips">+ Filters <span class="bar__count" id="filterCount">[00]</span></button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter projects" hidden></div>

  <aside class="plist" id="plist" aria-label="Project listing" hidden>
    <div class="plist__top">
      <span class="plist__eyebrow">Projects open</span>
      <button class="plist__close" id="listClose" type="button">× Close</button>
    </div>
    <h2 class="plist__title">Project<br>listing</h2>
    <ul class="plist__rows" id="plistRows"></ul>
    <div class="plist__foot">
      <span>Filter by area</span>
      <div class="plist__tabs" id="plistTabs"></div>
    </div>
  </aside>

  <div class="card-slot" id="cardSlot"></div>

  <div class="intro" id="intro" hidden>
    <h1 class="intro__title">How to use<br>the map</h1>
    <div class="intro__cards">
      <div class="intro__card"><span class="intro__num">001</span>
        <svg class="intro__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="5"/><path d="M12 7v4"/></svg>
        <b>Scroll</b><span>Zoom in and out of the map</span></div>
      <div class="intro__card"><span class="intro__num">002</span>
        <svg class="intro__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>
        <b>Drag</b><span>Move around</span></div>
      <div class="intro__card"><span class="intro__num">003</span>
        <svg class="intro__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-5.5 1.5L15 20l-3 1.5-2.5-6.5L6 18z"/></svg>
        <b>Click</b><span>View project details</span></div>
    </div>
    <button class="btn btn--solid intro__enter" id="introEnter" type="button">Enter the map <span aria-hidden="true">→</span></button>
  </div>
</div>

<script type="module" src="assets/projects.js"></script>
</body>
</html>
